            - $ref: '#/components/schemas/ReportInputCriteriaDto'
      required:
        - type
        - inputCriteria
    ReportResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Report ID
        createdAt:
          format: date-time
          type: string
          description: Report creation date
        type:
          type: string
          description: Report type
          enum:
            - MOVEMENTS
            - PAYINS
            - PAYOUTS
        status:
          type: string
          description: Report status
          enum:
            - PENDING
            - GENERATING
            - COMPLETED
        inputCriteria:
          type: object
          description: Input criteria used to generate the report
          example:
            createdAtFrom: '2025-01-01T00:00:00.000Z'
            createdAtTo: '2025-01-31T23:59:59.999Z'
        files:
          description: List of S3 keys for generated report files (100,000 records each)
          type: array
          items:
            type: string
        fileUrls:
          description: Signed URLs to download report files (valid for 1 hour)
          type: array
          items:
            type: string
        organizationId:
          type: string
          description: Organization ID
      required:
        - id
        - createdAt
        - type
        - status
        - inputCriteria
        - files
        - fileUrls
        - organizationId
    ReportsPaginatedResponseDto:
      type: object
      properties:
        data:
          description: List of reports
          type: array
          items:
            $ref: '#/components/schemas/ReportResponseDto'
        pagination:
          type: object
          description: Pagination metadata
          example:
            page: 1
            limit: 10
            total: 50
            totalPages: 5
            hasNext: true
            hasPrev: false
      required:
        - data
        - pagination
