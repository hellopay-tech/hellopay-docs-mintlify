        - reference
        - amountInCents
        - callbackUrl
    PaymentLinkResponse:
      type: object
      properties:
        paymentLinkId:
          type: string
          description: Unique payment link ID
          example: ad78347a-9fd5-40b3-9e18-d89a0fe9989d
        paymentLinkUrl:
          type: string
          description: Hosted checkout URL. Redirect the payer here.
