        createdAt:
          format: date-time
          type: string
          description: Creation timestamp
          example: '2024-01-01T00:00:00.000Z'
        expiresAt:
          format: date-time
          type: string
          description: When the link expires (1 hour after creation)
          example: '2024-01-01T01:00:00.000Z'
        status:
          type: string
          description: Payment link status
          enum:
            - PENDING
            - COMPLETED
            - EXPIRED
          example: PENDING
        inlineCustomer:
          description: Pre-filled payer data, or `null`
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CustomerDataDto'
        rail:
          type: string
          nullable: true
          description: Rail restriction, or `null` for an open checkout
          enum:
            - BRE_B
            - PSE
          example: PSE
      required:
        - paymentLinkId
        - paymentLinkUrl
        - createdAt
        - expiresAt
        - status
        - inlineCustomer
        - rail
    ReportInputCriteriaDto:
      type: object
